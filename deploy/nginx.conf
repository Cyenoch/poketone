map $http_upgrade $connection_upgrade {
    default upgrade;
    '' close;
}

server {
    listen 8080;
    listen [::]:8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    server_tokens off;

    # The image entrypoint reads /etc/resolv.conf: Docker DNS also forwards public names.
    resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;

    location = /multiplayer {
        set $harbor ${HARBOR_UPSTREAM};
        proxy_pass $harbor;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $proxy_host;
        # The public hop to Harbor carries seat tokens: an https upstream must present a valid cert.
        proxy_ssl_server_name on;
        proxy_ssl_verify on;
        proxy_ssl_verify_depth 3;
        proxy_ssl_trusted_certificate /etc/ssl/certs/ca-certificates.crt;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_buffering off;
    }

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /healthz {
        access_log off;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        return 200 "ok\n";
    }

    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # UI font atlases: each set's manifest names its current json + pages (content-hashed names), so
    # is always revalidated and the pairs never change under their names.
    location ~ "^/fonts/gpu/(core/|base/)?manifest\.json$" {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Quoted: an unquoted `{16}` ends the directive and nginx refuses the whole file.
    location ~ "^/fonts/gpu/.+\.[0-9a-f]{16}\.(json|webp)$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # nginx's stock mime.types has no .webmanifest; served as octet-stream, some browsers skip it.
    location = /manifest.webmanifest {
        types { application/manifest+json webmanifest; }
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    # Release builds request content-hashed copies (scripts/web-build.mjs assetUrls): a new file is a
    # new URL, so these never change and can be cached forever.
    location ~ "^/(models|art|audio|textures)/.+\.[0-9a-f]{16}\.[A-Za-z0-9]+$" {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # Plain names (the files' own names) can change content under the same URL: always revalidate.
    location ~ ^/(models|art|audio|textures|fonts)/ {
        add_header Cache-Control "no-cache" always;
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
